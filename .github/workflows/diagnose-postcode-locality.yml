name: Diagnose postcode locality integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-postcode-locality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postcode-locality-diagnostic:
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 5
    steps:
      - name: Check live theme and postcode provider without changing orders
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          error_reporting(E_ALL);
          ini_set('display_errors', '1');

          $root = '/home/chavevertical-loja/htdocs/loja.chavevertical.com';
          if (!is_readable($root.'/wp-load.php')) {
              echo "wp_load=unavailable\n";
              exit(1);
          }
          require_once $root . '/wp-load.php';
          echo "site_ok=" . (parse_url(home_url(), PHP_URL_HOST) === 'loja.chavevertical.com' ? 'yes' : 'no') . "\n";
          echo "theme=" . get_stylesheet() . "\n";
          echo "locality_function=" . (function_exists('cvl_postcode_locality_resolve') ? 'present' : 'missing') . "\n";
          echo "checkout_page_mode=";
          $page = wc_get_page_id('checkout');
          $markup = (string) get_post_field('post_content', $page);
          echo str_contains($markup,'wp:woocommerce/checkout') ? 'blocks' : 'other';
          echo "\n";

          foreach (array('1000-098', '6160-152') as $postcode) {
              $url = 'https://moradas.dev/cp/'.$postcode;
              $http = wp_remote_get($url, array(
                  'timeout' => 8,
                  'redirection' => 0,
                  'sslverify' => true,
                  'headers' => array('Accept' => 'application/json'),
              ));
              echo "postcode_test=$postcode\n";
              if (is_wp_error($http)) {
                  echo "external_status=WP_ERROR;code=".$http->get_error_code().";message=".substr($http->get_error_message(),0,140)."\n";
                  continue;
              }
              $code = (int) wp_remote_retrieve_response_code($http);
              $type = (string) wp_remote_retrieve_header($http,'content-type');
              $body = (string) wp_remote_retrieve_body($http);
              echo "external_http=$code;type=$type;length=".strlen($body)."\n";
              $decoded = json_decode($body,true);
              if (is_array($decoded)) {
                  echo "json_keys=".implode(',',array_slice(array_keys($decoded),0,30))."\n";
                  $sanitized = array_intersect_key($decoded,array_flip(array('cp7','localidade','concelho','distrito','detail','message','error')));
                  echo "public_fields=".json_encode($sanitized, JSON_UNESCAPED_UNICODE | JSON_INVALID_UTF8_SUBSTITUTE)."\n";
              } else {
                  echo "body_prefix=".substr(preg_replace('/[[:cntrl:]]/',' ',$body),0,150)."\n";
              }
              if (function_exists('cvl_postcode_locality_parse_reply')) {
                  $parsed = cvl_postcode_locality_parse_reply($code,$body,$postcode);
                  echo "parsed=".json_encode($parsed,JSON_UNESCAPED_UNICODE)."\n";
              }
          }

          // AJAX HTTP com nonce de visitante: valida o percurso do checkout
          // sem criar sessão, encomendas ou enviar dados do cliente.
          $ajax_url = admin_url('admin-ajax.php');
          $ajax_result = wp_remote_post($ajax_url, array(
              'timeout' => 12,
              'redirection' => 0,
              'sslverify' => true,
              'body' => array(
                  'action' => 'cvl_postcode_locality',
                  'nonce' => wp_create_nonce('cvl_postcode_locality'),
                  'country' => 'PT',
                  'postcode' => '1000-098',
              ),
          ));
          if (is_wp_error($ajax_result)) {
              echo "checkout_ajax_status=WP_ERROR;code=".$ajax_result->get_error_code()."\n";
          } else {
              $ajax_status = wp_remote_retrieve_response_code($ajax_result);
              $ajax_json = json_decode(wp_remote_retrieve_body($ajax_result), true);
              echo "checkout_ajax_http=$ajax_status\n";
              echo "checkout_ajax_success=".(is_array($ajax_json) && !empty($ajax_json['success']) ? 'yes':'no')."\n";
              $info = is_array($ajax_json) ? ($ajax_json['data'] ?? array()) : array();
              echo "checkout_ajax_result=".json_encode(array_intersect_key((array) $info,array_flip(array('status','localidade'))),JSON_UNESCAPED_UNICODE)."\n";
          }

          $path = get_template_directory().'/assets/js/checkout-postcode-locality.js';
          echo "javascript_file=".(is_file($path)?'present':'missing')."\n";
          echo "javascript_bytes=".(is_file($path)?filesize($path):0)."\n";
          PHP

      - name: Inspect public checkout HTML and script availability
        shell: bash
        run: |
          set -euo pipefail
          TMP_HTML=$(mktemp)
          TMP_JS=$(mktemp)
          trap 'rm -f "$TMP_HTML" "$TMP_JS"' EXIT

          echo "CHECKOUT_FRONTEND:"
          CHECKOUT_META=$(curl --silent --show-error --location --max-time 15 \
            --header "Cache-Control: no-cache" \
            --output "$TMP_HTML" \
            --write-out 'http=%{http_code};final_url=%{url_effective};bytes=%{size_download}' \
            'https://loja.chavevertical.com/checkout/' || true)
          echo "$CHECKOUT_META"
          if grep -q 'checkout-postcode-locality.js' "$TMP_HTML"; then
            echo "frontend_contains_locality_script=yes"
          else
            echo "frontend_contains_locality_script=no"
          fi
          if grep -q 'wp-block-woocommerce-checkout' "$TMP_HTML"; then
            echo "frontend_contains_checkout_block=yes"
          else
            echo "frontend_contains_checkout_block=no"
          fi
          if grep -q 'wc-block-checkout' "$TMP_HTML"; then
            echo "frontend_contains_checkout_form=yes"
          else
            echo "frontend_contains_checkout_form=no"
          fi
          echo "PUBLIC_ASSET:"
          ASSET_META=$(curl --silent --show-error --location --max-time 15 \
            --header "Cache-Control: no-cache" \
            --output "$TMP_JS" \
            --write-out 'http=%{http_code};bytes=%{size_download};content_type=%{content_type}' \
            'https://loja.chavevertical.com/wp-content/themes/chavevertical-lite/assets/js/checkout-postcode-locality.js' || true)
          echo "$ASSET_META"
          if grep -q "getCustomerData" "$TMP_JS"; then
            echo "asset_contains_blocks_store_logic=yes"
          else
            echo "asset_contains_blocks_store_logic=no"
          fi

      - name: Inspect populated guest checkout (no order)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/home/chavevertical-loja/htdocs/loja.chavevertical.com"
          COOKIE_JAR=$(mktemp)
          TEMP_CART=$(mktemp)
          TEMP_CHECKOUT=$(mktemp)
          trap 'rm -f "$COOKIE_JAR" "$TEMP_CART" "$TEMP_CHECKOUT"' EXIT

          # Select a published, priced, in-stock SIMPLE product for a guest cart.
          # The add-to-cart operation does not reserve stock or create an order.
          PRODUCT_ID=$(cd "$ROOT" && php <<'PHP'
          <?php
          error_reporting(0);
          require_once '/home/chavevertical-loja/htdocs/loja.chavevertical.com/wp-load.php';
          if (!function_exists('wc_get_products')) exit(1);
          $products = wc_get_products(array(
              'status' => 'publish',
              'type' => 'simple',
              'stock_status' => 'instock',
              'limit' => 60,
              'orderby' => 'ID',
              'order' => 'ASC',
          ));
          foreach ($products as $product) {
              if ($product->is_purchasable()
                  && $product->is_in_stock()
                  && '' !== (string) $product->get_price()
                  && $product->get_price() > 0
                  && !$product->is_sold_individually()) {
                  echo $product->get_id();
                  exit(0);
              }
          }
          exit(2);
          PHP
          ) || {
            echo "visitor_cart_test=skipped:no-simple-product"
            exit 0
          }

          echo "visitor_selected_published_product_id=$PRODUCT_ID"
          HOME_META=$(curl --silent --show-error --max-time 20 --location \
            --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
            --output "$TEMP_CART" \
            --write-out 'http=%{http_code};final_url=%{url_effective}' \
            "https://loja.chavevertical.com/?add-to-cart=$PRODUCT_ID" || true)
          echo "visitor_add_to_cart=$HOME_META"

          CHECKOUT_META=$(curl --silent --show-error --location --max-time 20 \
            --cookie-jar "$COOKIE_JAR" --cookie "$COOKIE_JAR" \
            --header 'Cache-Control: no-cache' \
            --output "$TEMP_CHECKOUT" \
            --write-out 'http=%{http_code};final_url=%{url_effective};bytes=%{size_download}' \
            'https://loja.chavevertical.com/checkout/' || true)
          echo "visitor_checkout=$CHECKOUT_META"

          for target in 'checkout-postcode-locality.js' 'CVLPostcodeLocality' 'wc-block-checkout' 'wc-blocks-data-store' 'checkout-customer-type.js' 'checkout-vies.js'; do
            if grep -q "$target" "$TEMP_CHECKOUT"; then
              echo "visitor_checkout_contains[$target]=yes"
            else
              echo "visitor_checkout_contains[$target]=no"
            fi
          done

          if grep -q 'cvl-checkout-postcode-locality-js' "$TEMP_CHECKOUT"; then
            echo "visitor_locality_enqueue=yes"
          else
            echo "visitor_locality_enqueue=no"
          fi

          echo "visitor_cookies_count=$(grep -c 'woocommerce\|wp_woocommerce' "$COOKIE_JAR" || true)"
