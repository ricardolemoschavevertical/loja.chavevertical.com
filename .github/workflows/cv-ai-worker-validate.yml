name: Validate CV AI Worker
on:
  push:
    branches: [main]
    paths:
      - "ops/cloudflare/cv-ai-enricher/**"
      - ".github/workflows/cv-ai-worker-validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Worker JS syntax
        run: node --check ops/cloudflare/cv-ai-enricher/worker.mjs
      - name: Fail-closed health and authentication tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import worker from './ops/cloudflare/cv-ai-enricher/worker.mjs';
          const req=new Request('https://example.test/health');
          const noBindings=await worker.fetch(req,{});
          assert.equal(noBindings.status,503);
          const body=await noBindings.json();
          assert.equal(body.ok,false);
          const denied=await worker.fetch(new Request('https://example.test/v1/lists'),{});
          assert.equal(denied.status,503);
          const fake={DB:{},JOBS:{},AI:{},CV_AI_TOKEN:'z'.repeat(64)};
          const healthy=await worker.fetch(req,fake);
          assert.equal(healthy.status,200);
          const h=await healthy.json();
          assert.equal(h.processing_enabled,false);
          assert.equal(h.product_apply_enabled,false);
          assert.equal(h.version,'0.4.0');
          assert.equal(h.provider,'workers_ai');
          assert.equal(h.gemini_accounts_configured,0);
          const account={key:'AIza'+'x'.repeat(44),label:'Fornecedor Principal',tier:'free'};
          const configured={...fake,
            CV_AI_CONFIG_JSON:JSON.stringify({
              provider:'gemini',gemini_model:'gemini-2.5-flash',
              jobs_enabled:true,product_apply_enabled:false,key_strategy:'auto'
            }),
            GEMINI_API_KEYS_JSON:JSON.stringify([account])
          };
          const configuredResp=await worker.fetch(req,configured);
          assert.equal(configuredResp.status,200);
          const configuredHealth=await configuredResp.json();
          assert.equal(configuredHealth.provider,'gemini');
          assert.equal(configuredHealth.gemini_accounts_configured,1);
          assert.equal(configuredHealth.processing_enabled,true);
          assert.equal(configuredHealth.product_apply_enabled,false);
          assert.ok(!JSON.stringify(configuredHealth).includes(account.key),
            'Gemini secret must never be returned from Worker');
          const modelForbidden=await worker.fetch(
            new Request('https://example.test/v1/providers/gemini/models'),configured);
          assert.equal(modelForbidden.status,401);
          const unauthorized=await worker.fetch(new Request('https://example.test/v1/lists'),fake);
          assert.equal(unauthorized.status,401);
          console.log('Worker health/auth and safety defaults: PASS');
          JS
