name: Preparar fusao segura categorias duplicadas
on:
  push:
    branches: [main]
    paths: [".github/workflows/cv-merge-backup-preflight.yml", "ops/cv-merge-backup-duplicates.php"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cv-full-category-audit-38053548266
          repository: ricardolemoschavevertical/loja.chavevertical.com
          run-id: 38053548266
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cv-category-source-snapshot
      - name: Lint and zero-write plan
        shell: bash
        env:
          CV_CATEGORY_MERGE_MODE: plan
          CV_CATEGORY_MERGE_SNAPSHOT: ${{ runner.temp }}/cv-category-source-snapshot/cv-category-full-inventory.json
          CV_CATEGORY_MERGE_OUTPUT_DIR: ${{ runner.temp }}/cv-category-preflight-${{ github.run_id }}
        run: |
          set -euo pipefail
          php -l ops/cv-merge-backup-duplicates.php
          mkdir -p "$CV_CATEGORY_MERGE_OUTPUT_DIR"
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/cv-merge-backup-duplicates.php
          test -s "$CV_CATEGORY_MERGE_OUTPUT_DIR/preflight-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-category-merge-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/cv-category-preflight-${{ github.run_id }}/
          retention-days: 15
          if-no-files-found: error
