name: Comparar slugs das categorias com backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv-compare-backup-category-slugs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar sintaxe da comparacao
        shell: bash
        run: php -l ops/compare-backup-category-slugs.php
      - name: Comparar slugs, pais e percurso de todas as categorias
        shell: bash
        env:
          CV_CATEGORY_SYNC_MODE: plan
          CV_CATEGORY_SYNC_OUTPUT_DIR: ${{ runner.temp }}/cv-category-backup-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$CV_CATEGORY_SYNC_OUTPUT_DIR"
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/compare-backup-category-slugs.php
          test -s "$CV_CATEGORY_SYNC_OUTPUT_DIR/comparacao-com-backup.json"
          test -s "$CV_CATEGORY_SYNC_OUTPUT_DIR/comparacao-com-backup.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-comparacao-categorias-${{ github.run_id }}
          path: ${{ runner.temp }}/cv-category-backup-${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: error
