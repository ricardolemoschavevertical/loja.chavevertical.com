name: Auditoria leitura categorias WooCommerce

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv-category-audit-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar script
        shell: bash
        run: php -l ops/audit-product-categories-readonly.php
      - name: Executar auditoria somente de leitura
        shell: bash
        env:
          CV_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/cv-category-audit-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$CV_AUDIT_OUTPUT_DIR"
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/audit-product-categories-readonly.php
          test -s "$CV_AUDIT_OUTPUT_DIR/categorias-auditoria.csv"
          test -s "$CV_AUDIT_OUTPUT_DIR/categorias-auditoria.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-categorias-auditoria-${{ github.run_id }}
          path: ${{ runner.temp }}/cv-category-audit-${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: error
