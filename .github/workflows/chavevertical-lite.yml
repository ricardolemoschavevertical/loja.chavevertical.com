name: Package and Deploy Chave Vertical Lite

on:
  push:
    branches: [main]
    paths:
      - "wp-content/themes/chavevertical-lite/**"
      - ".github/workflows/chavevertical-lite.yml"
      - "ops/deploy-theme.sh"
      - "ops/assets/**"
      - "ops/ensure-brands-page.php"
      - "ops/ensure-contactos-page.php"
      - "ops/ensure-quem-somos-page.php"
      - "ops/ensure-entregas-ao-domicilio-page.php"
      - "ops/ensure-termos-e-condicoes-page.php"
      - "ops/ensure-politica-de-privacidade-page.php"
      - "ops/ensure-pretty-permalinks.php"
      - "ops/verify-checkout-customer-type.php"
      - "ops/test-checkout-tax-validation-unit.php"
      - "ops/test-checkout-vies-unit.php"
      - "ops/test-checkout-postcodes-unit.php"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.latest.outputs.should_deploy }}
      latest_relevant_sha: ${{ steps.latest.outputs.latest_relevant_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only the latest relevant theme commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --no-tags

          LATEST_RELEVANT_SHA=$(git log -1 --format=%H origin/main -- \
            wp-content/themes/chavevertical-lite \
            .github/workflows/chavevertical-lite.yml \
            ops/deploy-theme.sh \
            ops/assets \
            ops/ensure-brands-page.php \
            ops/ensure-contactos-page.php \
            ops/ensure-quem-somos-page.php \
            ops/ensure-entregas-ao-domicilio-page.php \
            ops/ensure-termos-e-condicoes-page.php \
            ops/ensure-politica-de-privacidade-page.php \
            ops/ensure-pretty-permalinks.php)

          echo "latest_relevant_sha=$LATEST_RELEVANT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_SHA" == "$LATEST_RELEVANT_SHA" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "This run is the latest relevant theme revision: $GITHUB_SHA"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping obsolete theme revision $GITHUB_SHA; latest relevant revision is $LATEST_RELEVANT_SHA"
          fi

      - name: Validate PHP
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          THEME="wp-content/themes/chavevertical-lite"
          test -f "$THEME/style.css"
          test -f "$THEME/functions.php"
          test -f "$THEME/index.php"
          find "$THEME" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l ops/verify-checkout-customer-type.php
          php -l ops/test-checkout-tax-validation-unit.php
          php ops/test-checkout-tax-validation-unit.php
          php -l ops/test-checkout-vies-unit.php
          php ops/test-checkout-vies-unit.php
          php -l ops/test-checkout-postcodes-unit.php
          php ops/test-checkout-postcodes-unit.php
          node --check "$THEME/assets/js/checkout-customer-type.js"
          node --check "$THEME/assets/js/checkout-vies.js"
          node --check "$THEME/assets/js/checkout-postcodes.js"
          node --check "$THEME/assets/js/checkout-postcodes-blocks.js"
          php -l ops/ensure-brands-page.php
          php -l ops/ensure-contactos-page.php
          php -l ops/ensure-quem-somos-page.php
          php -l ops/ensure-entregas-ao-domicilio-page.php
          php -l ops/ensure-termos-e-condicoes-page.php
          php -l ops/ensure-politica-de-privacidade-page.php
          php -l ops/ensure-pretty-permalinks.php

      - name: Build installable ZIP
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wp-content/themes/chavevertical-lite/assets/images
          cd wp-content/themes
          zip -qr chavevertical-lite.zip chavevertical-lite
          unzip -t chavevertical-lite.zip

      - name: Upload theme ZIP
        if: steps.latest.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chavevertical-lite
          path: wp-content/themes/chavevertical-lite.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: package
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.ref == 'refs/heads/main' && needs.package.outputs.should_deploy == 'true'
    concurrency:
      group: chavevertical-lite-deploy-v2
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck latest relevant theme commit before deployment
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --no-tags

          LATEST_RELEVANT_SHA=$(git log -1 --format=%H origin/main -- \
            wp-content/themes/chavevertical-lite \
            .github/workflows/chavevertical-lite.yml \
            ops/deploy-theme.sh \
            ops/assets \
            ops/ensure-brands-page.php \
            ops/ensure-contactos-page.php \
            ops/ensure-quem-somos-page.php \
            ops/ensure-entregas-ao-domicilio-page.php \
            ops/ensure-termos-e-condicoes-page.php \
            ops/ensure-politica-de-privacidade-page.php \
            ops/ensure-pretty-permalinks.php)

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_SHA" == "$LATEST_RELEVANT_SHA" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying latest relevant theme revision: $GITHUB_SHA"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment $GITHUB_SHA; latest relevant revision is $LATEST_RELEVANT_SHA"
          fi

      - name: Download validated theme ZIP
        if: steps.latest.outputs.should_deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: chavevertical-lite
          path: ${{ runner.temp }}/chavevertical-lite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy and verify theme
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        env:
          THEME_ZIP: ${{ runner.temp }}/chavevertical-lite-${{ github.run_id }}-${{ github.run_attempt }}/chavevertical-lite.zip
        run: bash ops/deploy-theme.sh "$THEME_ZIP"

      - name: Verify checkout fiscal fields (read-only)
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php ops/verify-checkout-customer-type.php

      - name: Ensure brands page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-brands-page.php

      - name: Ensure contacts page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-contactos-page.php

      - name: Ensure Quem Somos page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-quem-somos-page.php

      - name: Ensure delivery page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-entregas-ao-domicilio-page.php

      - name: Ensure terms page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-termos-e-condicoes-page.php

      - name: Ensure privacy page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-politica-de-privacidade-page.php

      - name: Ensure pretty permalinks
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: php ops/ensure-pretty-permalinks.php

      - name: Verify Quem Somos page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 10 --max-time 60 -sS \
            'https://loja.chavevertical.com/quem-somos/?cvlaboutverify=1' \
            -o /tmp/cvl-quem-somos.html
          grep -q 'cvl-about-catalog-hero' /tmp/cvl-quem-somos.html
          grep -q 'A Chave Vertical, Lda. nasceu a 21 de julho de 2010' /tmp/cvl-quem-somos.html
          grep -q 'cvl-about-timeline-year">2017<' /tmp/cvl-quem-somos.html
          grep -q 'href="https://loja.chavevertical.com/quem-somos/"' /tmp/cvl-quem-somos.html

      - name: Verify delivery page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 10 --max-time 60 -sS \
            'https://loja.chavevertical.com/entregas-ao-domicilio/?cvldeliveryverify=1' \
            -o /tmp/cvl-entregas.html
          grep -q 'cvl-institutional-catalog-hero' /tmp/cvl-entregas.html
          grep -q '>Envios e Entregas<' /tmp/cvl-entregas.html
          grep -q 'Produtos volumosos, pesados ou sujeitos a transporte especial' /tmp/cvl-entregas.html
          grep -q 'Última atualização: 20 de junho de 2026' /tmp/cvl-entregas.html
          grep -q 'href="https://loja.chavevertical.com/entregas-ao-domicilio/"' /tmp/cvl-entregas.html

      - name: Verify terms page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 10 --max-time 60 -sS \
            'https://loja.chavevertical.com/termos-e-condicoes/?cvltermsverify=1' \
            -o /tmp/cvl-termos.html
          grep -q 'cvl-institutional-catalog-hero' /tmp/cvl-termos.html
          grep -q '>Termos e Condições<' /tmp/cvl-termos.html
          grep -q '1. Identificação da empresa' /tmp/cvl-termos.html
          grep -q '19. Lei aplicável' /tmp/cvl-termos.html
          grep -q 'Última atualização: 16 de maio de 2026' /tmp/cvl-termos.html
          grep -q 'href="https://loja.chavevertical.com/termos-e-condicoes/"' /tmp/cvl-termos.html

      - name: Verify privacy page
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 10 --max-time 60 -sS \
            'https://loja.chavevertical.com/politica-de-privacidade/?cvlprivacyverify=1' \
            -o /tmp/cvl-privacidade.html
          grep -q 'cvl-institutional-catalog-hero' /tmp/cvl-privacidade.html
          grep -q '>Política de Privacidade<' /tmp/cvl-privacidade.html
          grep -q '1. Introdução' /tmp/cvl-privacidade.html
          grep -q '13. Contacto' /tmp/cvl-privacidade.html
          grep -q 'Direitos dos Titulares dos Dados' /tmp/cvl-privacidade.html
          grep -q 'href="https://loja.chavevertical.com/politica-de-privacidade/"' /tmp/cvl-privacidade.html

      - name: Verify shop catalog layout
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 10 --max-time 60 -sS             'https://loja.chavevertical.com/shop/?cvlcatalogverify=1'             -o /tmp/cvl-shop-catalog.html

          CUSTOM_GRID_COUNT=$(grep -o 'cvl-category-grid-page' /tmp/cvl-shop-catalog.html | wc -l || true)
          CUSTOM_CARD_COUNT=$(grep -o 'class="cvl-category-card"' /tmp/cvl-shop-catalog.html | wc -l || true)
          NATIVE_CATEGORY_COUNT=$(grep -o '<li class="product-category product' /tmp/cvl-shop-catalog.html | wc -l || true)
          PRODUCT_COUNT=$(grep -oE '<li[^>]*class="[^"]*product[^"]*post-[0-9]+[^"]*"[^>]*>' /tmp/cvl-shop-catalog.html | wc -l || true)

          echo "custom_grid_count=$CUSTOM_GRID_COUNT"
          echo "custom_card_count=$CUSTOM_CARD_COUNT"
          echo "native_category_count=$NATIVE_CATEGORY_COUNT"
          echo "product_count=$PRODUCT_COUNT"

          test "$CUSTOM_GRID_COUNT" -eq 1
          test "$CUSTOM_CARD_COUNT" -gt 0
          test "$NATIVE_CATEGORY_COUNT" -eq 0
          test "$PRODUCT_COUNT" -eq 0
          grep -q '<h1>CATÁLOGO</h1>' /tmp/cvl-shop-catalog.html
          if grep -Eq '<h1[^>]*>Shop</h1>|<h2[^>]*>Categorias</h2>' /tmp/cvl-shop-catalog.html; then
            echo "Unexpected Shop/Categorias heading still present."
            exit 1
          fi

      - name: Verify approved product card
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -L --connect-timeout 10 --max-time 60 -sS \
            'https://loja.chavevertical.com/categoria-produto/ar-comprimido/?cvlcardverify=1' \
            -o /tmp/cvl-product-card.html

          grep -q 'cvl-product-brand-sku-row' /tmp/cvl-product-card.html
          grep -q 'cvl-product-status-row' /tmp/cvl-product-card.html
          grep -q 'cvl-product-price-row' /tmp/cvl-product-card.html
          grep -q 'cvl-product-price-net' /tmp/cvl-product-card.html
          grep -q 'cvl-card-eye-button' /tmp/cvl-product-card.html
          grep -q 'cvl-cart-button-label">ADICIONAR<' /tmp/cvl-product-card.html
          grep -q 'Preço S/ IVA' /tmp/cvl-product-card.html

          CSS_URL=$(grep -oE 'https://loja\.chavevertical\.com/wp-content/themes/chavevertical-lite/assets/css/v13\.css[^" ]*' /tmp/cvl-product-card.html | head -n 1 | sed 's/&#038;/\&/g')
          test -n "$CSS_URL"
          curl -L --connect-timeout 10 --max-time 60 -sS "$CSS_URL" -o /tmp/cvl-v13.css
          grep -q 'v0.16.93 — Product card approved reference' /tmp/cvl-v13.css
          grep -q 'color:#e10d0d!important' /tmp/cvl-v13.css
          grep -q 'cvl-card-wishlist' /tmp/cvl-v13.css

          echo "Approved product card is present in production markup and CSS."


      - name: Verify homepage product rows
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -L --connect-timeout 10 --max-time 60 -sS             'https://loja.chavevertical.com/?cvlhomegridverify=1'             -o /tmp/cvl-home-grid.html

          PROMO_COUNT=$(awk '/cvl-home-promo-products/{capture=1} capture{print} capture && /<\/section>/{exit}' /tmp/cvl-home-grid.html | grep -oE '<li[^>]*class="[^"]*product[^"]*post-[0-9]+' | wc -l | tr -d ' ')
          RECENT_COUNT=$(awk '/cvl-home-recent-products/{capture=1} capture{print} capture && /<\/section>/{exit}' /tmp/cvl-home-grid.html | grep -oE '<li[^>]*class="[^"]*product[^"]*post-[0-9]+' | wc -l | tr -d ' ')

          echo "promo_products=$PROMO_COUNT"
          echo "recent_products=$RECENT_COUNT"

          test "$PROMO_COUNT" -eq 16
          test "$RECENT_COUNT" -eq 8

          curl -L --connect-timeout 10 --max-time 60 -sS             'https://loja.chavevertical.com/wp-content/themes/chavevertical-lite/assets/css/v13.css?cvlhomegridverify=01696'             -o /tmp/cvl-home-v13.css

          grep -q 'v0.16.96 — Homepage product rows' /tmp/cvl-home-v13.css
          grep -q 'grid-template-columns:repeat(8,minmax(0,1fr))!important' /tmp/cvl-home-v13.css

          echo 'Homepage rows verified: Novidades=8, Promocoes=16, desktop columns=8.'

