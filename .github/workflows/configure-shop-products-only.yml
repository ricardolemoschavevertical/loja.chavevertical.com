name: Configure Shop Products Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-shop-products-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Show products only on WooCommerce shop
        shell: bash
        run: |
          set -euo pipefail
          WP_ROOT=/home/chavevertical-loja/htdocs/loja.chavevertical.com

          echo -n "before="
          wp --path="$WP_ROOT" option get woocommerce_shop_page_display 2>/dev/null || true
          echo

          # WooCommerce uses an empty value for the default "Show products" mode.
          wp --path="$WP_ROOT" option update woocommerce_shop_page_display ''

          # Clear WooCommerce/WordPress caches that can retain archive output.
          wp --path="$WP_ROOT" transient delete --all >/dev/null 2>&1 || true
          wp --path="$WP_ROOT" cache flush >/dev/null 2>&1 || true

          echo -n "after="
          wp --path="$WP_ROOT" option get woocommerce_shop_page_display 2>/dev/null || true
          echo

          curl -L --connect-timeout 10 --max-time 60 -sS             'https://loja.chavevertical.com/shop/?cvshopproducts=1'             -o /tmp/cv-shop-products.html

          CATEGORY_COUNT=$(grep -o '<li class="product-category product' /tmp/cv-shop-products.html | wc -l || true)
          PRODUCT_COUNT=$(grep -oE '<li[^>]*class="[^"]*product[^"]*post-[0-9]+[^"]*"[^>]*>' /tmp/cv-shop-products.html | wc -l || true)

          echo "category_count=$CATEGORY_COUNT"
          echo "product_count=$PRODUCT_COUNT"

          if [[ "$CATEGORY_COUNT" -ne 0 ]]; then
            echo "Shop still renders categories."
            exit 1
          fi

          if [[ "$PRODUCT_COUNT" -lt 1 ]]; then
            echo "Shop did not render products."
            exit 1
          fi
