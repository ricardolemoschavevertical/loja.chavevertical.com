name: Smoke test CV AI Cloudflare and WordPress 0.4
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv-ai-worker-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Worker health, safe defaults, unauthenticated requests denied
        shell: bash
        run: |
          set -euo pipefail
          url=https://cv-ai-enricher.chavevertical.workers.dev
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cv-ai-health.json -w '%{http_code}' "$url/health")
          echo "WORKER_HEALTH_HTTP=$code"
          cat /tmp/cv-ai-health.json
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cv-ai-health.json'))
          assert d['ok'] is True
          assert d['version']=='0.5.0'
          assert d['provider']=='workers_ai'
          assert d['gemini_accounts_configured']==0
          assert d['bindings_ready'] is True
          assert d['auth_ready'] is True
          assert d['processing_enabled'] is False
          assert d['product_apply_enabled'] is False
          print('Worker DB, Queue, AI and auth configured; writes and processing disabled.')
          PY
          unauthorized=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cv-ai-unauth.json -w '%{http_code}' "$url/v1/lists")
          echo "WORKER_UNAUTH_HTTP=$unauthorized"
          test "$unauthorized" = "401"

      - name: Confirmar que os endpoints WordPress exigem credenciais
        shell: bash
        run: |
          set -euo pipefail
          woo_code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cv-ai-restricted -w '%{http_code}' "https://loja.chavevertical.com/wp-json/cv-ai/v1/catalog/categories")
          echo "WORDPRESS_CV_AI_UNAUTH_HTTP=$woo_code"
          test "$woo_code" = 401
          mcp_code=$(curl -sS --connect-timeout 10 --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            -o /tmp/cv-mcp-restricted -w '%{http_code}' \
            "https://loja.chavevertical.com/wp-json/cv-mcp/v1/mcp")
          echo "WORDPRESS_CV_MCP_UNAUTH_HTTP=$mcp_code"
          test "$mcp_code" = 401
