name: Prepare transparent footer assets

on:
  push:
    paths:
      - '.github/workflows/footer-assets-transparent.yml'

permissions:
  contents: write

jobs:
  build-footer-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download and remove legacy gray background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wp-content/themes/chavevertical-lite/assets/images/footer-src
          mkdir -p wp-content/themes/chavevertical-lite/assets/images/footer

          curl -fL 'https://astro.chavevertical.com/logo-footer.webp?v=20260927-3' -o wp-content/themes/chavevertical-lite/assets/images/footer-src/logo-footer.webp
          curl -fL 'https://astro.chavevertical.com/livro-reclamacoes.webp?v=20260927-3' -o wp-content/themes/chavevertical-lite/assets/images/footer-src/livro-reclamacoes.webp
          curl -fL 'https://astro.chavevertical.com/shopmania-badge.png?v=20260927-3' -o wp-content/themes/chavevertical-lite/assets/images/footer-src/shopmania-badge.png
          curl -fL 'https://astro.chavevertical.com/google-site-seguro.png?v=20260927-3' -o wp-content/themes/chavevertical-lite/assets/images/footer-src/google-site-seguro.png
          curl -fL 'https://astro.chavevertical.com/pagamentos.webp?v=20260927-3' -o wp-content/themes/chavevertical-lite/assets/images/footer-src/pagamentos.webp

          python - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image

          src = Path('wp-content/themes/chavevertical-lite/assets/images/footer-src')
          out = Path('wp-content/themes/chavevertical-lite/assets/images/footer')
          out.mkdir(parents=True, exist_ok=True)

          files = {
              'logo-footer.webp': 'logo-footer.png',
              'livro-reclamacoes.webp': 'livro-reclamacoes.png',
              'shopmania-badge.png': 'shopmania-badge.png',
              'google-site-seguro.png': 'google-site-seguro.png',
              'pagamentos.webp': 'pagamentos.png',
          }

          target = (47, 47, 47)
          tolerance = 34

          def close_to_legacy_bg(px):
              r, g, b, a = px
              if a == 0:
                  return True
              return max(abs(r-target[0]), abs(g-target[1]), abs(b-target[2])) <= tolerance

          for source_name, output_name in files.items():
              im = Image.open(src / source_name).convert('RGBA')
              w, h = im.size
              p = im.load()
              q = deque()
              seen = set()

              for x in range(w):
                  q.append((x, 0))
                  q.append((x, h - 1))
              for y in range(h):
                  q.append((0, y))
                  q.append((w - 1, y))

              removed = 0
              while q:
                  x, y = q.popleft()
                  if (x, y) in seen:
                      continue
                  seen.add((x, y))
                  if not close_to_legacy_bg(p[x, y]):
                      continue
                  r, g, b, a = p[x, y]
                  p[x, y] = (r, g, b, 0)
                  removed += 1
                  if x > 0: q.append((x - 1, y))
                  if x + 1 < w: q.append((x + 1, y))
                  if y > 0: q.append((x, y - 1))
                  if y + 1 < h: q.append((x, y + 1))

              im.save(out / output_name, optimize=True)
              print(f'{source_name}: {w}x{h}, transparent background pixels={removed}')
          PY

          rm -rf wp-content/themes/chavevertical-lite/assets/images/footer-src

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/themes/chavevertical-lite/assets/images/footer/
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'assets: add transparent footer artwork'
          git push
