name: Diagnose Woo Trash Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-trash-actions.yml"
      - "ops/diagnose-trash-actions.php"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com'
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate diagnostic
        run: php -l ops/diagnose-trash-actions.php
      - name: Reproduce trash restore delete
        run: php ops/diagnose-trash-actions.php
