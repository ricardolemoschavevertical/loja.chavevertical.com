name: Evitar segunda fusao concorrente categorias

on:
  push:
    branches: [main]
    paths: [".github/workflows/cv-stop-overlapping-category-merge.yml"]

permissions:
  contents: read
  actions: write

jobs:
  cancel-overlap:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancelar apenas o nosso job concorrente 38053943180
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ricardolemoschavevertical/loja.chavevertical.com/actions/runs/38053943180/cancel"
          echo "cancel-requested=38053943180"
