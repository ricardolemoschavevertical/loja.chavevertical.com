name: Diagnose real checkout browser

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-checkout-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install isolated headless Chromium (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cvl-playwright" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/cvl-playwright/node_modules/.bin/playwright" install chromium

      - name: Test guest checkout with a temporary cart (no purchase)
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/cvl-playwright/node_modules"
          node <<'NODE'
          const { chromium } = require('playwright');

          async function main() {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({locale:'pt-PT',timezoneId:'Europe/Lisbon'});
            const page = await context.newPage();
            page.setDefaultTimeout(12000);
            const errors = [];
            page.on('pageerror', e=>errors.push(String(e).slice(0,250)));
            page.on('console', msg=>{
              if(msg.type()==='error')errors.push('console: '+msg.text().slice(0,250));
            });
            await page.goto('https://loja.chavevertical.com/?add-to-cart=3069',{waitUntil:'domcontentloaded',timeout:45000});
            const checkoutResponse = await page.goto('https://loja.chavevertical.com/checkout/',{waitUntil:'domcontentloaded',timeout:45000});
            console.log('checkout_http='+checkoutResponse.status());
            console.log('checkout_url='+page.url());
            if(!page.url().includes('/checkout/')){
              throw new Error('Visitor cart not persisted; checkout redirected '+page.url());
            }
            await page.waitForTimeout(3500);
            const before=await page.evaluate(()=>{
              const data=window.wp&&window.wp.data;
              const cart=data&&data.select('wc/store/cart');
              const checkout=data&&data.select('wc/store/checkout');
              const customer=cart&&cart.getCustomerData&&cart.getCustomerData();
              return {
                script:!!document.getElementById('cvl-checkout-postcode-locality-js'),
                config:!!window.CVLPostcodeLocality,
                block:!!document.querySelector('.wc-block-checkout'),
                cartStore:!!cart,
                getCustomerData:typeof(cart&&cart.getCustomerData),
                setShippingAddress:typeof(data&&data.dispatch('wc/store/cart')?.setShippingAddress),
                items:cart?.getCartData?.()?.itemsCount??null,
                needsShipping:cart?.getNeedsShipping?.()??null,
                sameAddress:checkout?.getUseShippingAsBilling?.()??null,
                postcodeField:!!document.querySelector('#shipping-postcode'),
                billingPostcodeField:!!document.querySelector('#billing-postcode'),
                shippingCountry:customer?.shippingAddress?.country??null,
                billingCountry:customer?.billingAddress?.country??null,
                shippingCityPresent:!!customer?.shippingAddress?.city,
              };
            });
            console.log('checkout_inspection='+JSON.stringify(before));

            // Read-only diagnosis of native Woo Blocks address ordering and actions.
            const addressDetails=await page.evaluate(()=>{
              const data=window.wp?.data;
              const checkout=data?.select('wc/store/checkout');
              const actions=data?.dispatch('wc/store/checkout');
              const selectors=Object.keys(actions??{}).filter(k=>/shipping|billing|editing|address/i.test(k));
              const checkbox=Array.from(document.querySelectorAll('input[type="checkbox"]')).map(el=>({
                id:el.id,checked:el.checked,
                label:el.labels?.[0]?.textContent?.trim()?.slice(0,110)??'',
                parent:el.closest('[class*="checkout"]')?.className?.toString()?.slice(0,100)??''
              }));
              const classes=[
                'wp-block-woocommerce-checkout-contact-information-block',
                'wp-block-woocommerce-checkout-shipping-method-block',
                'wp-block-woocommerce-checkout-shipping-address-block',
                'wp-block-woocommerce-checkout-billing-address-block',
                'wp-block-woocommerce-checkout-additional-information-block',
                'wp-block-woocommerce-checkout-payment-block'
              ];
              const order=Array.from(document.querySelectorAll('.wc-block-checkout *'))
                .filter(el=>classes.some(cl=>el.classList?.contains(cl)))
                .map(el=>classes.find(cl=>el.classList.contains(cl)));
              return {
                actions:selectors,
                checkbox,
                order,
                useShippingAsBilling:checkout?.getUseShippingAsBilling?.()??null,
                billingFieldVisible:!!document.querySelector('#billing-address_1'),
                shippingFieldVisible:!!document.querySelector('#shipping-address_1')
              };
            });
            console.log('address_details='+JSON.stringify(addressDetails));

            // Experiment only within this temporary guest visitor session:
            // open the native billing address without any order/cart submission.
            const billingProbe=await page.evaluate(()=>{
              const store=window.wp?.data;
              const before=store?.select('wc/store/checkout')?.getUseShippingAsBilling?.()??null;
              const action=store?.dispatch('wc/store/checkout')?.__internalSetUseShippingAsBilling;
              if (typeof action === 'function') {
                action(false);
              }
              return {before,action:typeof action};
            });
            await page.waitForTimeout(450);
            const probeAfter=await page.evaluate(()=>{
              const data=window.wp?.data;
              return {
                useShippingAsBilling:data?.select('wc/store/checkout')?.getUseShippingAsBilling?.()??null,
                billingVisible:!!document.querySelector('#billing-address_1'),
                shippingVisible:!!document.querySelector('#shipping-address_1'),
                billingHeaders:Array.from(document.querySelectorAll('h2,h3'))
                  .map(el=>el.textContent?.trim()).filter(s=>/fatur|entreg|envio|ship|billing/i.test(s)).slice(0,14),
                checkbox:Array.from(document.querySelectorAll('.wc-block-checkout__use-address-for-billing input[type="checkbox"]'))
                  .map(el=>el.checked)
              };
            });
            console.log('billing_probe='+JSON.stringify({before:billingProbe,after:probeAfter}));



            // Fiscal fields created by the WooCommerce Blocks native API.
            const fiscalSelectors = await page.evaluate(()=>{
              return Array.from(document.querySelectorAll('input,select')).filter(el=>/cvl-fiscal|customer-type|nipc|nif/i.test(el.id)).map(el=>({
                id:el.id,tag:el.tagName,label:el.labels?.[0]?.textContent?.trim()?.slice(0,90)??'',
                visible:el.getClientRects().length>0,
                options:el.tagName==='SELECT'?Array.from(el.options).map(o=>o.value):undefined
              }));
            });
            console.log('native_fiscal_fields='+JSON.stringify(fiscalSelectors));

            const typeField = page.locator('select[id*="cvl-fiscal-customer-type"]');
            if(await typeField.count()!==1){
              throw new Error('Native company/individual selector not visible in real checkout');
            }
            await typeField.selectOption('empresa');
            await page.waitForTimeout(600);
            const companyFields = await page.evaluate(()=>{
              return Array.from(document.querySelectorAll('input[id*="cvl-fiscal-"]')).map(e=>({
                id:e.id,visible:e.getClientRects().length>0
              }));
            });
            console.log('fiscal_company_fields='+JSON.stringify(companyFields));
            if(!companyFields.some(x=>x.id.includes('-company-name')&&x.visible)
              ||!companyFields.some(x=>x.id.endsWith('-nipc')&&x.visible)){
              throw new Error('Company name and NIPC fields must appear after choosing Empresa');
            }

            await typeField.selectOption('particular');
            await page.waitForTimeout(500);
            const personFields = await page.evaluate(()=>{
              return Array.from(document.querySelectorAll('input[id*="cvl-fiscal-"]')).map(e=>({
                id:e.id,visible:e.getClientRects().length>0
              }));
            });
            console.log('fiscal_person_fields='+JSON.stringify(personFields));
            if(!personFields.some(x=>x.id.endsWith('-nif')&&x.visible)
              ||personFields.some(x=>x.id.endsWith('-nipc')&&x.visible)){
              throw new Error('NIF only must appear for Particular');
            }
            console.log('REAL_BROWSER_FISCAL_FIELDS=PASS');

            // Confirm that fiscal fields were moved next to Billing, before payment.
            const sectionOrder = await page.evaluate(()=>{
              const classes = [
                'wp-block-woocommerce-checkout-billing-address-block',
                'wp-block-woocommerce-checkout-additional-information-block',
                'wp-block-woocommerce-checkout-payment-block'
              ];
              return Array.from(document.querySelectorAll('.wc-block-checkout *'))
                .filter(el=>classes.some(cl=>el.classList?.contains(cl)))
                .map(el=>classes.find(cl=>el.classList.contains(cl)));
            });
            console.log('checkout_fiscal_section_order='+JSON.stringify(sectionOrder));
            const billingIndex=sectionOrder.indexOf('wp-block-woocommerce-checkout-billing-address-block');
            const fiscalIndex=sectionOrder.indexOf('wp-block-woocommerce-checkout-additional-information-block');
            const paymentIndex=sectionOrder.indexOf('wp-block-woocommerce-checkout-payment-block');
            // Woo Blocks unmounts billing address fields when "Same as shipping" is
            // selected; in that mode its wrapper is absent from the DOM.
            // Verify the fiscal step always precedes payment, and its position
            // relative to Billing when that section is actually rendered.
            if(fiscalIndex<0 || paymentIndex<0 || fiscalIndex>=paymentIndex
              || (billingIndex>=0 && billingIndex>=fiscalIndex)){
              throw new Error('Fiscal section must precede payment and follow Billing when rendered');
            }
            console.log('REAL_BROWSER_FISCAL_PLACEMENT=PASS');

            // Billing first, delivery address cloned only when native checkbox
            // in the fiscal/billing section is selected (guest cart only).
            const deliveryChoice=page.locator('#order-cvl-fiscal-use-billing-for-shipping');
            if(await deliveryChoice.count()!==1){
              throw new Error('Same billing address for delivery checkbox is missing');
            }
            const billingFirst=await page.evaluate(()=>{
              const data=window.wp.data;
              const blocks=['wp-block-woocommerce-checkout-billing-address-block',
                            'wp-block-woocommerce-checkout-additional-information-block',
                            'wp-block-woocommerce-checkout-shipping-address-block'];
              const order=Array.from(document.querySelectorAll('.wc-block-checkout *'))
                .filter(el=>blocks.some(cl=>el.classList?.contains(cl)))
                .map(el=>blocks.find(cl=>el.classList.contains(cl)));
              return {
                order,
                useShippingAsBilling:data.select('wc/store/checkout').getUseShippingAsBilling(),
                billingVisible:!!document.querySelector('#billing-address_1'),
                sameLabel:document.querySelector('#order-cvl-fiscal-use-billing-for-shipping')
                  ?.labels?.[0]?.textContent?.trim()??''
              };
            });
            console.log('BILLING_FIRST_INIT='+JSON.stringify(billingFirst));
            if(billingFirst.useShippingAsBilling!==false ||
              !billingFirst.billingVisible ||
              billingFirst.order[0]!=='wp-block-woocommerce-checkout-billing-address-block' ||
              billingFirst.order[1]!=='wp-block-woocommerce-checkout-additional-information-block' ||
              billingFirst.order[2]!=='wp-block-woocommerce-checkout-shipping-address-block'){
              throw new Error('Billing and fiscal sections are not displayed before shipping address');
            }
            if(!billingFirst.sameLabel.includes('faturação para entrega')){
              throw new Error('Missing explicit matching delivery label');
            }

            await deliveryChoice.check();
            await page.evaluate(()=>{
              const wpData=window.wp.data;
              const data=wpData.select('wc/store/cart').getCustomerData();
              wpData.dispatch('wc/store/cart').setBillingAddress({
                ...data.billingAddress,
                country:'PT',
                first_name:'Cliente',
                last_name:'Teste',
                address_1:'Rua Exemplo 4',
                city:'Lisboa',
                postcode:'1000-098',
                phone:'911000000'
              });
            });
            await page.waitForTimeout(1200);
            const sameAfter=await page.evaluate(()=>{
              const cart=window.wp.data.select('wc/store/cart').getCustomerData();
              return {
                billing:{address:cart.billingAddress.address_1,city:cart.billingAddress.city,postcode:cart.billingAddress.postcode},
                shipping:{address:cart.shippingAddress.address_1,city:cart.shippingAddress.city,postcode:cart.shippingAddress.postcode},
                shippingHidden:getComputedStyle(document.querySelector('.wp-block-woocommerce-checkout-shipping-address-block')).display==='none',
                shippingMethodPresent:!!document.querySelector('.wp-block-woocommerce-checkout-shipping-method-block')
              };
            });
            console.log('BILLING_SAME_SHIPPING='+JSON.stringify(sameAfter));
            if(sameAfter.shipping.address!==sameAfter.billing.address
              ||sameAfter.shipping.city!==sameAfter.billing.city
              ||sameAfter.shipping.postcode!==sameAfter.billing.postcode
              ||!sameAfter.shippingHidden||!sameAfter.shippingMethodPresent){
              throw new Error('Checked billing same for delivery failed to copy or hide duplicates');
            }

            await deliveryChoice.uncheck();
            await page.waitForTimeout(350);
            const separateBefore=await page.evaluate(()=>{
              const el=document.querySelector('.wp-block-woocommerce-checkout-shipping-address-block');
              return el?getComputedStyle(el).display:'missing';
            });
            if(separateBefore==='none'||separateBefore==='missing'){
              throw new Error('Unchecking same delivery did not show separate shipping address');
            }

            await page.evaluate(()=>{
              const data=window.wp.data;
              const customer=data.select('wc/store/cart').getCustomerData();
              data.dispatch('wc/store/cart').setShippingAddress({
                ...customer.shippingAddress, address_1:'Rua Transporte 9',city:'Porto',postcode:'4000-001'
              });
              data.dispatch('wc/store/cart').setBillingAddress({
                ...customer.billingAddress, address_1:'Rua da Fatura 8',city:'Coimbra',postcode:'3000-001'
              });
            });
            await page.waitForTimeout(450);
            const different=await page.evaluate(()=>{
              const d=window.wp.data.select('wc/store/cart').getCustomerData();
              return {billing:d.billingAddress.address_1,shipping:d.shippingAddress.address_1};
            });
            console.log('BILLING_DIFFERENT_SHIPPING='+JSON.stringify(different));
            if(different.billing!=='Rua da Fatura 8'||different.shipping!=='Rua Transporte 9'){
              throw new Error('Billing and shipping must remain independent when unchecked');
            }

            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(320);
            const mobileOkay=await page.evaluate(()=>{
              const a=document.querySelector('#billing-address_1');
              const type=document.querySelector('#order-cvl-fiscal-customer-type');
              const delivery=document.querySelector('#order-cvl-fiscal-use-billing-for-shipping');
              return !!a?.getClientRects().length&&!!type?.getClientRects().length&&!!delivery?.getClientRects().length;
            });
            console.log('MOBILE_BILLING_FIRST='+mobileOkay);
            if(!mobileOkay){
              throw new Error('Billing-first checkout is not fully visible on mobile');
            }
            await page.setViewportSize({width:1280,height:960});
            console.log('REAL_BROWSER_BILLING_SHIPPING=PASS');





            if(!before.script||!before.cartStore||!before.config){
              throw new Error('Required checkout script/store/config missing');
            }

            // Only touch this temporary visitor's cart store. No order submits.
            const section=before.needsShipping===false?'billing':'shipping';
            const setAddress=await page.evaluate(section=>{
              const store=window.wp.data;
              const customer=store.select('wc/store/cart').getCustomerData();
              const name=section+'Address';
              const address=Object.assign({},customer[name],{country:'PT',postcode:'1000-098',city:''});
              const action=section==='billing'?'setBillingAddress':'setShippingAddress';
              store.dispatch('wc/store/cart')[action](address);
              return action;
            },section);
            console.log('set_postcode_action='+setAddress);
            await page.waitForTimeout(5500);
            const after=await page.evaluate(section=>{
              const customer=window.wp?.data?.select('wc/store/cart')?.getCustomerData?.();
              const address=customer?.[section+'Address'];
              return {
                postcode:address?.postcode??null,
                city:address?.city??null,
                inputCity:document.getElementById(section+'-city')?.value??null,
                inputPostcode:document.getElementById(section+'-postcode')?.value??null,
              };
            },section);
            console.log('after_autofill='+JSON.stringify(after));
            console.log('page_errors='+JSON.stringify(errors.slice(0,12)));

            await context.close();
            await browser.close();
            if(after.city!=='Lisboa'){
              throw new Error('Auto-fill did not set city to Lisboa in Blocks store');
            }
            console.log('REAL_BROWSER_POSTCODE_AUTOFILL=PASS');
          }
          main().catch(err=>{console.error('BROWSER_CHECKOUT_FAIL='+String(err));process.exit(1);});
          NODE
