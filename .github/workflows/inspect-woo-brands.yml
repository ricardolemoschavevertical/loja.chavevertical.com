name: Inspect Woo Brand Taxonomy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-woo-brands.yml"
      - "ops/inspect-brand-taxonomy.php"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect brand taxonomies
        run: php ops/inspect-brand-taxonomy.php
