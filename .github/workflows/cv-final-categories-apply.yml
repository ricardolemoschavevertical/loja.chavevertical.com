name: Finalizar alinhamento comercial categorias Woo
on:
  workflow_run:
    workflows: ["Aplicar reorganizacao de categorias face ao backup"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: cv-category-production-merge
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'ricardolemoschavevertical/loja.chavevertical.com' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.id == 38056071731
    runs-on: [self-hosted, Linux, X64, loja-chavevertical]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperar prova persistida da fase anterior
        uses: actions/download-artifact@v4
        with:
          name: cv-misplaced-migracao-${{ github.event.workflow_run.id }}
          repository: ricardolemoschavevertical/loja.chavevertical.com
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cv-stage2-proof

      - name: Recuperar inventário anterior de 926 categorias (somente para auditoria)
        uses: actions/download-artifact@v4
        with:
          name: cv-category-after-merge-38054294512
          repository: ricardolemoschavevertical/loja.chavevertical.com
          run-id: 38054294512
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cv-stage2-original-snapshot

      - name: Reparar apenas 301 caso a fase anterior tenha terminado por timeout
        shell: bash
        env:
          CV_STAGE2_RESULT: ${{ runner.temp }}/cv-stage2-proof/resultado-final.json
          CV_MISPLACED_RECOVER_MODE: plan
          CV_MISPLACED_RECOVER_SNAPSHOT: ${{ runner.temp }}/cv-stage2-original-snapshot/cv-category-full-inventory.json
          CV_MISPLACED_RECOVER_PLAN: ${{ runner.temp }}/cv-stage2-proof/plano-reorganizar.json
          CV_MISPLACED_RECOVER_JOURNAL: ${{ runner.temp }}/cv-stage2-proof/journal.ndjson
          CV_MISPLACED_RECOVER_DIR: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}/recovery
        run: |
          set -euo pipefail
          if [ -s "$CV_STAGE2_RESULT" ]; then
            echo "Fase anterior tem resultado-final.json; recuperação não necessária"
            exit 0
          fi
          echo "Resultado anterior ausente. Revalidar as 25 fusões e reparar SOMENTE redirecionamentos."
          if ps -eo args= | grep -E 'wp .*eval-file .*cv-realign-backup-misplaced.php' | grep -v grep; then
            echo "WordPress ainda está a processar a fase anterior; bloqueado"
            exit 1
          fi
          php -l ops/cv-recover-misplaced-redirects.php
          mkdir -p "$CV_MISPLACED_RECOVER_DIR"
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/cv-recover-misplaced-redirects.php
          RECOVERY_PLAN="$CV_MISPLACED_RECOVER_DIR/recovery-plan.json" python3 - <<'PY'
          import json,os
          p=json.load(open(os.environ['RECOVERY_PLAN']))
          assert p['mode']=='plan' and p['source_categories']==926 and p['live_categories']==901
          assert p['merged']==25 and p['reparented']==2
          assert p['redirects_required']>=25 and p['redirects_missing']>=0
          print('Preflight recuperação:',p['redirects_required'],'301 necessários,',p['redirects_missing'],'em falta')
          PY
          CV_MISPLACED_RECOVER_MODE=apply \
          CV_MISPLACED_RECOVER_CONFIRM=RESTORE_ONLY_VERIFIED_CATEGORY_REDIRECTS \
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/cv-recover-misplaced-redirects.php
          test -s "$CV_MISPLACED_RECOVER_DIR/resultado-final.json"
          cp "$CV_MISPLACED_RECOVER_DIR/resultado-final.json" "$CV_STAGE2_RESULT"

      - name: Validar resultado completo da reorganização anterior
        shell: bash
        env:
          CV_STAGE2_RESULT: ${{ runner.temp }}/cv-stage2-proof/resultado-final.json
          CV_FINAL_MERGE_MODE: plan
          CV_FINAL_MERGE_DIR: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s "$CV_STAGE2_RESULT"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['CV_STAGE2_RESULT']))
          assert d['status']=='success', 'Segundo lote não concluiu'
          assert d['before']==926 and d['after']==901
          assert d['merges']==25 and d['reparented']==2
          assert d['redirects']>=206, 'Redirecionamentos em falta'
          print('Segundo lote concluído pelo próprio script WordPress:', d['merges'], 'fusões')
          PY
          php -l ops/cv-finalize-backup-categories.php
          mkdir -p "$CV_FINAL_MERGE_DIR"
          # Modo PLAN é estritamente só de leitura; validar árvore viva/backup agora.
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval-file ops/cv-finalize-backup-categories.php
          CV_FINAL_PLAN="$CV_FINAL_MERGE_DIR/plan.json" python3 - <<'PY'
          import os,json
          p=json.load(open(os.environ['CV_FINAL_PLAN']))
          assert p['mode']=='plan' and p['loja_before']==901
          assert p['expected_final_total']==895 and p['expected_commercial_unique_paths']==893
          assert len(p['groups'])==5 and len(p['category_ids_to_delete'])==6
          assert set(p['protected_term_ids'])=={15,2248}
          assert p['total_alternate_images_to_preserve']>=4
          print('Preflight final aprovado: cinco grupos, seis duplicados, imagens preservadas.')
          PY

      - name: Confirmar que não há migração concorrente
        shell: bash
        run: |
          set -euo pipefail
          if ps -eo args= | grep -E 'wp .*eval-file .*cv-realign-backup-misplaced.php' | grep -v grep; then
            echo "A migração anterior ainda está ativa; nenhuma escrita autorizada"
            exit 1
          fi
          # O workflow anterior terminou; o PHP de fusão já não está em execução.
          # Só libertar um lock obsoleto da segunda fase, depois de validar
          # resultado-final.json e o plano vivo de 901 categorias.
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval '
            $lock=get_option("cv_category_merge_operation_lock",false);
            if ($lock) {
              if (!is_array($lock) || ($lock["type"]??"")!=="misplaced") {
                fwrite(STDERR, "Existe um lock desconhecido. Nenhuma escrita permitida.\n");
                exit(1);
              }
              if (!delete_option("cv_category_merge_operation_lock")) {
                fwrite(STDERR, "Lock antigo nao foi libertado.\n");
                exit(2);
              }
              echo "stale-stage2-lock=released\n";
            }
            if (get_option("cv_category_merge_operation_lock",false)) {
              fwrite(STDERR, "Ainda existe bloqueio de escrita.\n");
              exit(3);
            }
            echo "taxonomy-merge-lock=free\n";
          '

      - name: Backup SQL da taxonomia imediatamente antes da operação
        shell: bash
        env:
          CV_FINAL_MERGE_DIR: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 0077
          ROOT=/home/chavevertical-loja/htdocs/loja.chavevertical.com
          prefix=$(wp --path="$ROOT" db prefix)
          wp --path="$ROOT" db export "$CV_FINAL_MERGE_DIR/taxonomia-antes-ultima-fase.sql" --tables="${prefix}terms,${prefix}term_taxonomy,${prefix}term_relationships,${prefix}termmeta" --single-transaction
          test -s "$CV_FINAL_MERGE_DIR/taxonomia-antes-ultima-fase.sql"
          test "$(stat -c '%s' "$CV_FINAL_MERGE_DIR/taxonomia-antes-ultima-fase.sql")" -gt 10000

      - name: Fundir os seis duplicados e corrigir slugs historicos
        shell: bash
        env:
          CV_FINAL_MERGE_MODE: apply
          CV_FINAL_MERGE_CONFIRM: CV_APLICAR_5_GRUPOS_AUDITADOS
          CV_FINAL_MERGE_DIR: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}
          CV_FINAL_MERGE_SQL_BACKUP: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}/taxonomia-antes-ultima-fase.sql
        run: |
          set -euo pipefail
          ROOT=/home/chavevertical-loja/htdocs/loja.chavevertical.com
          set +e
          timeout --signal=TERM --kill-after=9s 900s \
            wp --path="$ROOT" eval-file ops/cv-finalize-backup-categories.php \
            > "$CV_FINAL_MERGE_DIR/wp-final-run.log" 2>&1
          exit_code=$?
          set -e
          grep -E 'CV_FINAL_CATEGORY_PLAN|CV_FINAL_CATEGORY_DONE' "$CV_FINAL_MERGE_DIR/wp-final-run.log" || true
          if [ "$exit_code" -ne 0 ]; then
            # A operação só pode ser considerada se o resultado persistido comprovar
            # todas as alterações e a própria script tiver emitido a conclusão.
            if [ "$exit_code" -ne 124 ] || ! grep -q 'CV_FINAL_CATEGORY_DONE' "$CV_FINAL_MERGE_DIR/wp-final-run.log"; then
              tail -n 60 "$CV_FINAL_MERGE_DIR/wp-final-run.log"
              exit "$exit_code"
            fi
          fi
          RESULT="$CV_FINAL_MERGE_DIR/result.json" python3 - <<'PY'
          import os,json
          d=json.load(open(os.environ['RESULT']))
          assert d['status']=='success' and d['before']==901 and d['after']==895
          assert d['removed']==6 and d['groups']==5
          assert d['commercial_unique_paths']==893 and d['matched_backup_unique_paths']==893
          assert set(d['system_terms'])=={15,2248}
          print('FINAL RESULTADO',json.dumps(d,ensure_ascii=False))
          PY

      - name: Confirmar contagem e categorias de sistema na WooCommerce ativa
        shell: bash
        run: |
          set -euo pipefail
          wp --path=/home/chavevertical-loja/htdocs/loja.chavevertical.com eval '
            $terms=get_terms(["taxonomy"=>"product_cat","hide_empty"=>false,"fields"=>"ids"]);
            if (is_wp_error($terms) || count($terms)!==895) { fwrite(STDERR,"Contagem final incorreta\n");exit(1); }
            foreach([15,2248] as $id)if(!term_exists($id,"product_cat")){fwrite(STDERR,"Termo WooCommerce protegido ausente\n");exit(2);}
            echo "woo_categories=".count($terms).";protected=15,2248\n";
          '
      - name: Arquivar SQL e journal (reversão auditável)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-final-category-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/cv-final-category-${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: warn
